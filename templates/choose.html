{% extends "base.html" %}
{% block content %}
<section class="hero">
  <div>
    <h1>Choose your duck</h1>
    <p>This secret link is shared by two people. Pick your duck to check in.</p>
  </div>
  <div class="card">
    <h2>{{ user1_name }}</h2>
    <p><a class="button" href="{{ user1_link }}">I am {{ user1_name }}</a></p>
    <h2 style="margin-top: 1.6rem;">{{ user2_name }}</h2>
    <p><a class="button" href="{{ user2_link }}">I am {{ user2_name }}</a></p>
  </div>
</section>
{% endblock %}
